name: Phase 0 - Site Probe

# Manual investigation of https://newsroom.mazda.com used to fill in src/sources.ts
# (Phase 0 of mazda-news-spec.md). Not part of the daily pipeline.
#
# Run from the Actions tab ("Run workflow") and read the job log. It checks
# robots.txt, looks for an RSS <link> tag on the release list page, and dumps
# one article page so the HTML structure (title / date / body) can be read off.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UA: "mazda-news-en/1.0 (+https://github.com/noriyuki1113/mazda-news)"
  LIST_URL: "https://newsroom.mazda.com/ja/publicity/release/"
  ARTICLE_URL: "https://newsroom.mazda.com/ja/publicity/release/2026/202606/260626a.html"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: "1. robots.txt"
        run: |
          echo "::group::GET https://newsroom.mazda.com/robots.txt"
          curl -sS -A "$UA" "https://newsroom.mazda.com/robots.txt"
          echo "::endgroup::"

      - name: Wait 2s (crawl etiquette)
        run: sleep 2

      - name: "2. Release list page - RSS discovery"
        run: |
          status=$(curl -sS -A "$UA" --compressed -L -w '%{http_code}' -o list.html "$LIST_URL")
          echo "GET $LIST_URL -> HTTP $status, saved $(wc -c < list.html) bytes"

          echo "::group::<link rel=alternate ... rss ...> matches"
          grep -ioE '<link[^>]*rel=["'"'"']alternate["'"'"'][^>]*>' list.html || echo "(no <link rel=alternate> tags found)"
          echo "::endgroup::"

          echo "::group::Any tag/attribute mentioning rss (case-insensitive)"
          grep -ioE '<[a-z]+[^>]*rss[^>]*>' list.html || echo "(no tag containing 'rss' found)"
          echo "::endgroup::"

          echo "::group::<head> section (first 150 lines) for manual inspection"
          awk '/<head/{f=1} f{print; n++} /<\/head>/{f=0} n>150{exit}' list.html
          echo "::endgroup::"

      - name: "2b. Release list page - item structure & duplicate check (Phase 1)"
        run: |
          echo "::group::Total vs unique release links (href pattern), and .pdf-only links"
          total_html=$(grep -oE 'href="[^"]*publicity/release/[0-9]{4}/[0-9]{6}/[0-9]{6}[a-z]\.html"' list.html | wc -l)
          unique_html=$(grep -oE 'href="[^"]*publicity/release/[0-9]{4}/[0-9]{6}/[0-9]{6}[a-z]\.html"' list.html | sort -u | wc -l)
          total_pdf=$(grep -oE 'href="[^"]*publicity/release/[0-9]{4}/[0-9]{6}/[0-9]{6}[a-z]\.pdf"' list.html | wc -l)
          echo ".html links: total=$total_html unique=$unique_html   (total>unique means duplicate listing exists)"
          echo ".pdf-only links found: $total_pdf"
          echo "::endgroup::"

          echo "::group::Known article (260626a) occurrence count in this list page"
          grep -c "260626a" list.html || echo "0"
          echo "::endgroup::"

          echo "::group::Raw HTML around first release link (60 lines of context)"
          line=$(grep -n 'publicity/release/2026/' list.html | head -1 | cut -d: -f1)
          if [ -n "$line" ]; then
            start=$((line>30?line-30:1))
            end=$((line+30))
            sed -n "${start},${end}p" list.html
          else
            echo "(no match found for publicity/release/2026/)"
          fi
          echo "::endgroup::"

          echo "::group::Raw HTML around SECOND occurrence of the known article link (to see the other listing block, if any)"
          line2=$(grep -n "260626a" list.html | sed -n '2p' | cut -d: -f1)
          if [ -n "$line2" ]; then
            start=$((line2>30?line2-30:1))
            end=$((line2+30))
            sed -n "${start},${end}p" list.html
          else
            echo "(only one occurrence, or article not on this year's list)"
          fi
          echo "::endgroup::"

          echo "::group::Year selector / pagination hints"
          grep -ioE '<select[^>]*>' list.html || echo "(no <select> found)"
          grep -ioE 'class="[^"]*pag[^"]*"' list.html | sort -u || echo "(no class containing 'pag' found)"
          echo "::endgroup::"

      - name: Wait 2s (crawl etiquette)
        run: sleep 2

      - name: "3. Article page - DOM structure"
        run: |
          status=$(curl -sS -A "$UA" --compressed -L -w '%{http_code}' -o article.html "$ARTICLE_URL")
          echo "GET $ARTICLE_URL -> HTTP $status, saved $(wc -c < article.html) bytes"

          echo "::group::<title> and <meta> tags"
          grep -ioE '<title>.*</title>' article.html
          grep -ioE '<meta[^>]*(og:title|og:description|article:published_time|description|date)[^>]*>' article.html
          echo "::endgroup::"

          echo "::group::Heading tags (h1/h2/h3) with attributes"
          grep -ioE '<h[123][^>]*>.{0,200}' article.html
          echo "::endgroup::"

          echo "::group::Elements whose class/id looks like title/date/body/content/article"
          grep -ioE '<[a-z0-9]+[^>]*(class|id)="[^"]*(title|date|headline|article|body|content|lead|release|text|main)[^"]*"[^>]*>' article.html | sort -u
          echo "::endgroup::"

          echo "::group::<time> tags"
          grep -ioE '<time[^>]*>.{0,100}' article.html || echo "(no <time> tags found)"
          echo "::endgroup::"

          echo "::group::Full raw HTML (for precise structure confirmation)"
          cat article.html
          echo "::endgroup::"

      - name: Wait 2s (crawl etiquette)
        run: sleep 2

      - name: "4. Phase 1 smoke test - fetchList(ja) and fetchList(en) against the live site"
        run: npx tsx scripts/smoke-fetch.ts

      - name: Wait 2s (crawl etiquette)
        run: sleep 2

      - name: "5. Phase 2 smoke test - pairReleases() and confirmJaOnly() against the live site"
        run: npx tsx scripts/smoke-pair.ts
